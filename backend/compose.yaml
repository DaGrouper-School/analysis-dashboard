# Development: this service on http://localhost:8090, with its database and
# a SAM it is onboarded on, at http://localhost:8091.
#
#   make up      (or: docker compose up --build)
#
# Then run the front end against it, from the repository root:
#   VITE_DATA_SOURCE=http VITE_API_URL=http://localhost:8090/api npm run dev -w frontend
#
# `media` is the S3-compatible store photos are kept in: SeaweedFS's S3
# gateway, with the development key in media-s3.json; `test-media` is the
# one `make test-media` tests the store against.
#
# `db` holds the development data; `test-db` is the server the tests create
# their own databases on (DGS_TEST_DATABASE_URL), with PostGIS, which the
# SAM the integration tests start needs. Their ports differ from SAM's, so
# both stacks run side by side.
#
# Building the image reads SAM's private module with SAM_READ_TOKEN, which
# `make up` takes from `gh auth token` when it is not set.
name: dgs

services:
  backend:
    build:
      context: .
      # Build steps use the host's network, so they resolve names however
      # the host does. On the default bridge they cannot reach a DNS server
      # whose address falls in Docker's 172.17.0.0/16, as on some Wi-Fi
      # networks.
      network: host
      secrets: [sam_read_token]
    environment:
      DGS_ENV: development
      DGS_ALLOWED_ORIGINS: http://localhost:5173
      DGS_DATABASE_URL: postgres://postgres:dgs@db:5432/dgs?sslmode=disable
      DGS_SAM_URL: http://sam:8080
      DGS_SAM_TENANT_FILE: /sam/tenant.json
      DGS_SAM_ISSUER: http://backend:8090
      DGS_MEDIA_URL: http://media:8333
      DGS_MEDIA_ACCESS_KEY: dgs-dev
      DGS_MEDIA_SECRET_KEY: dgs-dev-secret
    volumes:
      - sam-config:/sam:ro
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      db:
        condition: service_healthy
      media:
        condition: service_healthy
      sam:
        condition: service_healthy

  # SAM, built from the module version go.mod pins. sam-init sets its
  # deployment up and onboards this service once, keeping the operator's
  # key and the tenant file in the sam-config volume; SAM fetches this
  # service's key set by container name, which SAM_ALLOW_PRIVATE_KEY_SETS
  # allows.
  sam:
    build: &sam-build
      context: .
      target: sam
      network: host
      secrets: [sam_read_token]
    environment: &sam-env
      SAM_DATABASE_URL: postgres://postgres:dgs@sam-db:5432/sam?sslmode=disable
      SAM_ALLOW_PRIVATE_KEY_SETS: "true"
      SAM_LOG_FORMAT: text
    # The tenant file, which `make run` copies out from here.
    volumes:
      - sam-config:/config:ro
    ports: ["127.0.0.1:8091:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      retries: 30
    depends_on:
      sam-init:
        condition: service_completed_successfully

  sam-init:
    build: *sam-build
    environment: *sam-env
    volumes:
      - sam-config:/config
    entrypoint:
      - sh
      - -ec
      - |
        test -s /config/operator.json || sam bootstrap -json > /config/operator.json
        test -s /config/tenant.json || sam tenant create -name dgs -registry \
          -issuer http://backend:8090 -jwks http://backend:8090/api/.well-known/jwks.json \
          -audience sam -json > /config/tenant.json
    depends_on:
      sam-db:
        condition: service_healthy

  sam-db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_PASSWORD: dgs
      POSTGRES_DB: sam
    volumes:
      - sam-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      retries: 30

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: dgs
      POSTGRES_DB: dgs
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - dgs-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      retries: 30

  media:
    image: chrislusf/seaweedfs:4.55
    command: &media-command [server, -dir=/data, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3.json,
      -master.volumeSizeLimitMB=64, -ip.bind=0.0.0.0]
    volumes:
      - media-data:/data
      - ./media-s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck: &media-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 2s
      retries: 30

  test-media:
    image: chrislusf/seaweedfs:4.55
    command: *media-command
    volumes:
      - ./media-s3.json:/etc/seaweedfs/s3.json:ro
    tmpfs:
      - /data
    ports: ["127.0.0.1:58333:8333"]
    healthcheck: *media-health
    profiles: [test]

  test-db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_PASSWORD: dgs
    ports: ["127.0.0.1:55433:5432"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      retries: 30
    profiles: [test]

volumes:
  dgs-db:
  media-data:
  sam-data:
  sam-config:

secrets:
  sam_read_token:
    environment: SAM_READ_TOKEN
