# What this service serves before the front end's contract has it, checked
# with openapi.yaml by the integration tests. openapi.yaml is generated from
# the front end and never edited here; this file is.
#
# Each entry is an operation under paths, as in openapi.yaml, with two more
# fields:
#
#   x-change: new        an operation openapi.yaml lacks
#   x-change: changed    an operation openapi.yaml has, whose shapes this
#                        service changes; it replaces that operation and
#                        keeps its operationId
#   x-waits-for: ...     the front-end change that brings it into
#                        openapi.yaml
#
# Shapes of its own go under components; openapi.yaml's are referred to by
# its name, such as "openapi.yaml#/components/responses/Unauthenticated".
# Once the regenerated openapi.yaml has an entry, a test fails until the
# entry is removed. See docs/development.md, "The contract addendum".
paths:
  /admin/consent-texts:
    get:
      operationId: admin.listConsentTexts
      x-change: new
      x-waits-for: The consent text admin page, with its operations in routes.ts
      summary: List the consent text's versions
      description: 'The published versions of the guardian consent text, newest first. Access: platform admins only.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentTextVersion'
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
    post:
      operationId: admin.publishConsentText
      x-change: new
      x-waits-for: The consent text admin page, with its operations in routes.ts
      summary: Publish a consent text
      description: 'Publishes a new version in every language at once; it becomes the current one and is never changed.
        It keeps every language of the current version and has the default one, `en`. Access: platform admins only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentTexts'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentText'
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '409':
          $ref: openapi.yaml#/components/responses/Conflict
  /admin/consent-texts/{version}:
    get:
      operationId: admin.getConsentText
      x-change: new
      x-waits-for: The consent text admin page, with its operations in routes.ts
      summary: Get a consent text
      description: 'One version in every language. Access: platform admins only.'
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentText'
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
  /admin/stages:
    get:
      operationId: admin.listStages
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: List stages
      description: 'The classroom stages, in display order. Access: platform admins only.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                type: array
                items:
                  $ref: openapi.yaml#/components/schemas/ClassroomStage
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
  /admin/stages/{stageId}:
    put:
      operationId: admin.putStage
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Add or change a stage
      description: 'Adds the stage, or changes it, at its position in the list; answers with the list. Access: platform
        admins only.'
      parameters:
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
    delete:
      operationId: admin.deleteStage
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Delete a stage
      description: 'Deletes a stage no classroom is at. Access: platform admins only.'
      parameters:
      - name: stageId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
        '409':
          $ref: openapi.yaml#/components/responses/Conflict
  /admin/regions:
    get:
      operationId: admin.listRegions
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: List regions
      description: 'The regions, in display order. Access: platform admins only.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id002
                type: array
                items:
                  $ref: '#/components/schemas/Region'
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
  /admin/regions/{regionId}:
    put:
      operationId: admin.putRegion
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Add or change a region
      description: 'Adds the region, or changes it, at its position in the list; answers with the list. Access:
        platform admins only.'
      parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
    delete:
      operationId: admin.deleteRegion
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Delete a region
      description: 'Deletes a region no classroom is in. Access: platform admins only.'
      parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
        '409':
          $ref: openapi.yaml#/components/responses/Conflict
  /admin/host-questions:
    get:
      operationId: admin.listHostQuestions
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: List host questions
      description: 'Every readiness question, retired ones included, in order. Access: platform admins only.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id003
                type: array
                items:
                  $ref: '#/components/schemas/KeptHostQuestion'
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
  /admin/host-questions/{questionId}:
    put:
      operationId: admin.putHostQuestion
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Add or change a host question
      description: 'Adds the question, or changes it, at its position; a retired one no longer changes. Answers
        with the list. Access: platform admins only.'
      parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostQuestionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '409':
          $ref: openapi.yaml#/components/responses/Conflict
  /admin/host-questions/{questionId}/retire:
    post:
      operationId: admin.retireHostQuestion
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Retire a host question
      description: 'Applicants are no longer asked it; earlier applications keep their answers. Answers with the
        list. Access: platform admins only.'
      parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id003
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
  /admin/settings:
    get:
      operationId: admin.listSettings
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: List settings
      description: 'Every setting, null before the seed sets it. Access: platform admins only.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Setting'
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
  /admin/settings/{key}:
    put:
      operationId: admin.putSetting
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Replace a setting
      description: 'Checks the value strictly, naming every problem, and stores it. The body is the value: CoreParameters,
        DataTerms or Privacy. Access: platform admins only.'
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
  /admin/configuration-changes:
    get:
      operationId: admin.listConfigurationChanges
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: List configuration changes
      description: 'Every change to the platform''s configuration, newest first, a page at a time. Access: platform
        admins only.'
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: The next cursor of the page before.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationChanges'
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
  /admin/classrooms/{classroomId}:
    patch:
      operationId: admin.configureClassroom
      x-change: new
      x-waits-for: The platform configuration admin page, with its operations in routes.ts
      summary: Configure a classroom
      description: 'Sets a classroom''s stage, region and profile fields. A field left out stays as it is; regionId
        null clears it; each profile field replaces its own value only. Access: platform admins only.'
      parameters:
      - name: classroomId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomConfigurationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomConfiguration'
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '401':
          $ref: openapi.yaml#/components/responses/Unauthenticated
        '403':
          $ref: openapi.yaml#/components/responses/Forbidden
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
  /consent/{token}:
    get:
      operationId: consent.get
      x-change: changed
      x-waits-for: The guardian's page showing the consent text from the backend, and naming its version when deciding
      tags:
      - Guardian consent
      summary: Get
      description: 'What the guardian sees when they open their link, with the current consent text in their language
        (or the default, en), filled in, and its version, which a decision names. Access: public, no session needed.'
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: language
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentLinkRequest'
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
    post:
      operationId: consent.decide
      x-change: changed
      x-waits-for: The guardian's page showing the consent text from the backend, and naming its version when deciding
      tags:
      - Guardian consent
      summary: Decide
      description: 'Gives consent, or withdraws it, against the version of the consent text the page showed. A version
        that is no longer current is refused with consent_text_changed, and the page shows the new words. Access: public,
        no session needed.'
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: language
        in: query
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentLinkDecision'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentLinkRequest'
        '400':
          $ref: openapi.yaml#/components/responses/BadRequest
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
        '409':
          description: The consent text changed since the page showed it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentTextChanged'
  /public/classrooms/{classroomId}:
    get:
      operationId: publicSite.station
      x-change: changed
      x-waits-for: The site's words kept in the front end, with only the stages and regions from the backend
      tags:
      - Public site
      summary: Station
      description: 'A classroom''s station overview, from SAM''s latest values and its daily and hourly aggregates, read as
        the member when the caller is one, so its members also get values still in review and the last sync of any device;
        anyone else reads released values only, and sees a classroom that does not show its data publicly with no values.
        Access: public, no session needed.'
      security: []
      parameters:
      - name: classroomId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStationWithContent'
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
  /public/classrooms/{classroomId}/parameters/{parameterId}:
    get:
      operationId: publicSite.parameter
      x-change: changed
      x-waits-for: The site's words kept in the front end, with only the stages and regions from the backend
      tags:
      - Public site
      summary: Parameter
      description: 'One parameter of a classroom: its registry entry and its values over the season up to the latest,
        each hour''s last value and every reading of the last day. Read from SAM as the member when the caller is one, so
        its members also get values still in review; anyone else reads released values only, and a classroom that does
        not show its data publicly is not found. Access: public, no session needed.'
      security: []
      parameters:
      - name: classroomId
        in: path
        required: true
        schema:
          type: string
      - name: parameterId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicParameterPageWithContent'
        '404':
          $ref: openapi.yaml#/components/responses/NotFound
  /public/home:
    get:
      operationId: publicSite.home
      x-change: changed
      x-waits-for: The site's words kept in the front end, with only the stages and regions from the backend
      tags:
      - Public site
      summary: Home
      description: 'The home page: the stages and regions, and every classroom with its stage and core readings, read
        from SAM as a visitor. A classroom that does not show its data publicly is listed with no values. Visitors read
        released data only, so a core reading is released, or not released while nothing is. Access: public, no session
        needed.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHomePage'
  /public/content:
    get:
      operationId: publicSite.content
      x-change: changed
      x-waits-for: The site's words kept in the front end, with only the stages and regions from the backend
      tags:
      - Public site
      summary: Content
      description: 'The stages and regions, in display order; the site''s words are the front end''s. Access: public,
        no session needed.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSiteContent'
components:
  schemas:
    PublicSiteContent:
      type: object
      description: The site content the backend keeps, from platform configuration.
      properties:
        stages:
          type: array
          items:
            $ref: openapi.yaml#/components/schemas/ClassroomStage
        regions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
            required:
            - id
            - label
            additionalProperties: false
      required:
      - stages
      - regions
      additionalProperties: false
    PublicStationWithContent:
      type: object
      description: The front end's PublicStation, with the site content the backend keeps.
      properties:
        content:
          $ref: '#/components/schemas/PublicSiteContent'
        classroom:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/classroom
        units:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/units
        parameters:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/parameters
        domains:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/domains
        core:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/core
        completeness:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/completeness
        siteCodes:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/siteCodes
        can:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/can
        shared:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/shared
        places:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/places
        now:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/now
        devices:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/devices
        institution:
          $ref: openapi.yaml#/components/schemas/PublicStation/properties/institution
      required:
      - content
      - classroom
      - units
      - parameters
      - domains
      - core
      - completeness
      - siteCodes
      - can
      - shared
      - places
      - now
      - devices
      - institution
      additionalProperties: false
    PublicParameterPageWithContent:
      type: object
      description: The front end's PublicParameterPage, with the site content the backend keeps.
      properties:
        content:
          $ref: '#/components/schemas/PublicSiteContent'
        classroom:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/classroom
        parameter:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/parameter
        domain:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/domain
        note:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/note
        series:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/series
        rain:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/rain
        releasedThrough:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/releasedThrough
        inReview:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/inReview
        compare:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/compare
        deviceTypes:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/deviceTypes
        terms:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/terms
        member:
          $ref: openapi.yaml#/components/schemas/PublicParameterPage/properties/member
      required:
      - content
      - classroom
      - parameter
      - domain
      - note
      - series
      - rain
      - releasedThrough
      - inReview
      - compare
      - deviceTypes
      - terms
      - member
      additionalProperties: false
    PublicHomePage:
      type: object
      description: The front end's PublicHome, with the site content the backend keeps.
      properties:
        content:
          $ref: '#/components/schemas/PublicSiteContent'
        classrooms:
          type: array
          items:
            $ref: openapi.yaml#/components/schemas/PublicClassroom
        units:
          type: object
          properties:
            rain:
              type: string
            temperature:
              type: string
          required:
          - rain
          - temperature
          additionalProperties: false
      required:
      - content
      - classrooms
      - units
      additionalProperties: false
    ConsentLinkRequest:
      type: object
      description: The front end's ConsentRequest, with the current consent text filled in and its version.
      properties:
        contributorName:
          type: string
          description: The contributor's first name only.
        guardianName:
          type: string
        classroomNames:
          type: array
          items:
            type: string
        status:
          $ref: openapi.yaml#/components/schemas/ConsentStatus
        decidedAt:
          type:
          - string
          - 'null'
        coordinateDecimals:
          type: number
          description: Positions from the contributor's phone are rounded to this many decimal places.
        version:
          type: integer
          description: The consent text's version, which a decision names.
        text:
          $ref: openapi.yaml#/components/schemas/ConsentSheetContent
      required:
      - contributorName
      - guardianName
      - classroomNames
      - status
      - decidedAt
      - coordinateDecimals
      - version
      - text
      additionalProperties: false
    ConsentLinkDecision:
      type: object
      properties:
        give:
          type: boolean
        version:
          type: integer
          description: The consent text's version the page showed.
      required:
      - give
      - version
      additionalProperties: false
    ConsentTextChanged:
      type: object
      description: The Error for a decision on words that are no longer the current consent text.
      properties:
        code:
          type: string
          enum:
          - consent_text_changed
        message:
          type: string
      required:
      - code
      - message
      additionalProperties: false
    ConsentTexts:
      type: object
      description: One version's words by language code, such as en or am, with `{classroom}`, `{institution}` and
        `{decimals}` where each classroom's details go.
      propertyNames:
        pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
      additionalProperties:
        $ref: openapi.yaml#/components/schemas/ConsentSheetContent
    ConsentTextVersion:
      type: object
      properties:
        version:
          type: integer
        publishedAt:
          type: string
        publishedBy:
          type: string
          description: The admin's name at the time, or operator or seed.
        languages:
          type: array
          items:
            type: string
      required:
      - version
      - publishedAt
      - publishedBy
      - languages
