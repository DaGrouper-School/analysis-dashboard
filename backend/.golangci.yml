version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocognit
    - funlen
  settings:
    errcheck:
      # Closing a response body or a listener has nothing useful to report.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Listener).Close
    gocognit:
      min-complexity: 25
    funlen:
      lines: 80
      statements: 50
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
  exclusions:
    rules:
      # Tests may ignore errors from helpers that already fail the test.
      - path: _test\.go
        linters: [gocognit, funlen, revive]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
