            type: object
            properties:
              userId:
                type: string
              fullName:
                type: string
            required:
              - userId
              - fullName
            additionalProperties: false
          description: The classroom's minors, to print a sheet with a name already on it.
      required:
        - classroomName
        - institutionName
        - content
        - minors
      additionalProperties: false
      description: A classroom's printable consent sheet, with its words filled in (AP-38).
    ConsentSheetContent:
      type: object
      properties:
        title:
          type: string
        intro:
          type: string
          description: Paragraphs and sections may use `{classroom}`, `{institution}` and `{decimals}`, filled
            in for each classroom.
        sections:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
              body:
                type: string
            required:
              - heading
              - body
            additionalProperties: false
        choices:
          type: object
          properties:
            give:
              type: string
            withdraw:
              type: string
          required:
            - give
            - withdraw
          additionalProperties: false
          description: The two boxes the guardian ticks.
        contributorField:
          type: string
          description: The line for the young contributor's name, filled in when the sheet is for one minor.
        fields:
          type: array
          items:
            type: string
          description: Lines left blank for the guardian to fill in by hand.
        officeNote:
          type: string
          description: "For the classroom only, below the signature: how to record the sheet."
      required:
        - title
        - intro
        - sections
        - choices
        - contributorField
        - fields
        - officeNote
      additionalProperties: false
      description: The printable consent sheet's words (AP-38), edited as content rather than code.
    ConsentStatus:
      type: string
      enum:
        - not_needed
        - pending
        - given
        - withdrawn
      description: A guardian's consent for a minor (AP-04). `not_needed` for adults; a minor starts at
        `pending` and can send observations only while it is `given`.
    CoreReadings:
      type: object
      properties:
        day:
          type:
            - string
            - "null"
          description: "The day the rain values count, `YYYY-MM-DD` in UTC: the latest released reading's day."
        rainToday:
          type:
            - number
            - "null"
        rainLast7Days:
          type:
            - number
            - "null"
        rainDays:
          type: number
          description: Days of the seven with a rain total; under 7 means the total is partial.
        airTemperature:
          type:
            - number
            - "null"
        lastSync:
          type:
            - string
            - "null"
          description: When the latest released reading reached the platform.
        review:
          $ref: "#/components/schemas/ReviewState"
      required:
        - day
        - rainToday
        - rainLast7Days
        - rainDays
        - airTemperature
        - lastSync
        - review
      additionalProperties: false
      description: 'The shared core readings of one classroom (AP-20), from released data only. Null means
        no released data for it: shown as "no data", never as zero.'
    CreateClassroomInput:
      type: object
      properties:
        name:
          type: string
        institutionName:
          type: string
        headEmail:
          type: string
          description: Only platform admins create classrooms. Creating one invites this person as its head.
        applicationId:
          type: string
          description: The accepted host application (AP-30) it is set up from, if any.
      required:
        - name
        - institutionName
        - headEmail
      additionalProperties: false
    CreateLabInput:
      type: object
      properties:
        name:
          type: string
        placeName:
          type: string
        country:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        siteProfile:
          $ref: "#/components/schemas/SiteProfile"
      required:
        - name
        - placeName
        - country
        - location
        - siteProfile
      additionalProperties: false
    CsvExport:
      type: object
      properties:
        filename:
          type: string
        content:
          type: string
        rows:
          type: number
      required:
        - filename
        - content
        - rows
      additionalProperties: false
      description: A CSV file from SAM's export service, ready to save.
    CurrentConditions:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/Device"
        classroomName:
          type: string
        reading:
          $ref: "#/components/schemas/Reading"
