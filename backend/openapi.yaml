        - labName
        - name
        - type
        - identifier
        - samSourceId
        - registeredAt
      additionalProperties: false
      description: "A sensor registered to a lab. A device has no fixed position: GPS travels with each
        reading, so the same device can report from different places over time. People are never
        assigned to devices; access comes from classroom membership."
    DeviceAlert:
      type: object
