            additionalProperties: false
      required:
        - source
        - parameterId
        - points
      additionalProperties: false
    PublicSource:
      type: object
      properties:
        id:
          type: string
        name:
          type:
            - string
            - "null"
          description: The device's name; null for field observations.
        kind:
          type: string
          enum:
            - device
            - field
      required:
        - id
        - name
        - kind
      additionalProperties: false
      description: "Where a public value came from: a device by its name, or the classroom's field
        observations."
    PublicStation:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/SiteContent"
        classroom:
          $ref: "#/components/schemas/PublicClassroom"
        units:
          type: object
          properties:
            rain:
              type: string
            temperature:
              type: string
          required:
            - rain
            - temperature
          additionalProperties: false
          description: Units of the core readings, from the registry.
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
          description: Registry entries for every parameter shown, by ID.
        domains:
          type: array
          items:
            $ref: "#/components/schemas/PublicDomainCard"
        core:
          $ref: "#/components/schemas/StationCore"
          description: Review state, sources and today's range behind the core readings (AP-22).
        completeness:
          anyOf:
            - type: object
              properties:
                month:
                  type: string
                domains:
                  type: array
                  items:
                    $ref: "#/components/schemas/DomainCompleteness"
              required:
                - month
                - domains
              additionalProperties: false
            - type: "null"
          description: "\"How complete is this month?\": the month of the latest released reading, against the
            classroom's protocol. Null with no released data or no protocol."
        siteCodes:
          type: array
          items:
            type: string
          description: The classroom's site codes. Members only; empty for everyone else.
        member:
          type: boolean
          description: The viewer belongs to this classroom, so their dashboard shows it with raw values too.
        places:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              placeName:
                type:
                  - string
                  - "null"
                description: Where its first lab is, rounded; null before it has a lab.
              country:
                type:
                  - string
                  - "null"
              location:
                anyOf:
                  - $ref: "#/components/schemas/GeoPoint"
                  - type: "null"
              stageId:
                type: string
              regionId:
                type:
                  - string
                  - "null"
                description: Its region in `SiteContent.regions`; null until one is set.
            required:
              - id
              - name
              - placeName
              - country
              - location
              - stageId
              - regionId
            additionalProperties: false
          description: Every public classroom with a lab, for the location tabs and the globe (AP-43).
        now:
          type: array
          items:
            $ref: "#/components/schemas/NowTile"
          description: "\"What's happening now?\" (AP-43): one tile per configured value."
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PublicDevice"
          description: "The classroom's devices with released data, for the device picker on \"What's
            happening now?\" (AP-45). Each has its own tiles: its key values and their last 24
            hours."
        institution:
          anyOf:
            - $ref: "#/components/schemas/InstitutionOverview"
            - type: "null"
      required:
        - content
        - classroom
        - units
        - parameters
        - domains
        - core
        - completeness
        - siteCodes
        - member
        - places
        - now
        - devices
        - institution
      additionalProperties: false
      description: "A classroom's station overview for visitors (AP-21): released data only."
    PublicValue:
      type: object
      properties:
        parameterId:
          type: string
        value:
          type:
            - number
            - string
        observedAt:
          type: string
        source:
          $ref: "#/components/schemas/PublicSource"
        last7Days:
          type: array
          items:
            type:
              - number
              - "null"
          description: The last reading of each of the seven days up to this one, oldest first, for a
            sparkline. Null for a day with no reading; empty for values that are not numbers.
      required:
        - parameterId
        - value
        - observedAt
        - source
        - last7Days
      additionalProperties: false
      description: The latest released value of one parameter from one source.
    RawPage:
      type: object
      properties:
        classroomId:
          type: string
        classroomName:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RawRow"
        total:
          type: number
          description: Rows matching the filters, before the page limit.
        terms:
          $ref: "#/components/schemas/DataTerms"
        options:
          type: object
          properties:
            parameterIds:
              type: array
              items:
                type: string
            sources:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                      - device
                      - field
                required:
                  - id
                  - name
                  - kind
                additionalProperties: false
            sites:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                required:
                  - id
                  - name
                additionalProperties: false
          required:
            - parameterIds
            - sources
            - sites
          additionalProperties: false
      required:
        - classroomId
        - classroomName
        - rows
        - total
        - terms
        - options
      additionalProperties: false
      description: A page of raw values from one classroom, with the filters it can offer and its terms.
    RawQuery:
      type: object
      properties:
        classroomId:
          type: string
        from:
          type: string
          description: First day included, `YYYY-MM-DD` in UTC.
        to:
          type: string
          description: Last day included, `YYYY-MM-DD` in UTC.
        parameterId:
          type: string
        sourceId:
          type: string
          description: A device ID, or `field` for field observations.
        labId:
          type: string
        sort:
          $ref: "#/components/schemas/RawSortKey"
        order:
          type: string
          enum:
            - asc
            - desc
      required:
        - classroomId
      additionalProperties: false
      description: What to browse or export from one classroom. Unset filters include everything.
    RawRow:
      type: object
      properties:
        id:
          type: string
          description: "The reading's ID plus the parameter ID: unique per row."
        observedAt:
          type: string
        receivedAt:
          type: string
        parameterId:
          type: string
        value:
          type:
            - number
            - string
        sourceId:
          type: string
        sourceName:
          type: string
        sourceKind:
          type: string
          enum:
            - device
            - field
        labId:
          type: string
        siteName:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        locationSource:
          $ref: "#/components/schemas/ReadingLocationSource"
        contributorId:
          type:
            - number
            - "null"
          description: The participant ID of whoever recorded the value (AP-39); null only for readings a
            device sent on its own. SAM holds only the ID; names stay with the Da Grouper School
            platform.
      required:
        - id
        - observedAt
        - receivedAt
        - parameterId
        - value
        - sourceId
        - sourceName
        - sourceKind
        - labId
        - siteName
        - location
        - locationSource
        - contributorId
      additionalProperties: false
      description: One value of one reading or field observation, as SAM's export service returns it.
    RawSortKey:
      type: string
      enum:
        - time
        - parameter
        - source
        - site
      description: Columns the raw data table sorts by.
    Reading:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        labId:
          type: string
        classroomId:
          type: string
          description: Every reading is tagged with the classroom that owns the device.
        observedAt:
          type: string
        receivedAt:
          type: string
        values:
          type: object
          additionalProperties:
            type:
              - number
              - string
          description: Values keyed by parameter ID.
        location:
          $ref: "#/components/schemas/GeoPoint"
        locationSource:
          $ref: "#/components/schemas/ReadingLocationSource"
        creditedTo:
          type:
            - string
            - "null"
          description: The person who recorded it, shown only if they chose to take credit. Otherwise null and
            the reading is attributed to the classroom.
        recordedByParticipantId:
          type:
            - number
            - "null"
          description: The participant ID of whoever recorded it (AP-39), credited or not, so anyone can check
            it on the platform. Null only for readings a device sent on its own.
      required:
        - id
        - deviceId
        - labId
        - classroomId
        - observedAt
        - receivedAt
        - values
        - location
        - locationSource
        - creditedTo
        - recordedByParticipantId
      additionalProperties: false
      description: One measurement upload from a device, as stored by the backend and forwarded to SAM.
    ReadingInput:
      type: object
      properties:
        observedAt:
          type: string
        values:
          type: object
          additionalProperties:
            type:
              - number
              - string
        location:
          anyOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
          description: Null when the device has no GPS fix or no GPS at all.
      required:
        - observedAt
        - values
        - location
      additionalProperties: false
      description: What a device sends when it connects.
    ReadingLocationSource:
      type: string
      enum:
        - device
        - lab
      description: "Where a reading's position came from. `device`: GPS sent with the measurement. `lab`:
        the device sent no GPS, so the lab's location stands in. It is not the device's position."
    RegisterDeviceInput:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/DeviceType"
        identifier:
          type: string
      required:
        - name
        - type
        - identifier
      additionalProperties: false
      description: Registration identifies the device only. Location arrives later, with its readings.
    RegistryChange:
      type: object
      properties:
        id:
          type: string
        at:
          type: string
        byName:
          type: string
        summary:
          type: string
      required:
        - id
        - at
        - byName
        - summary
      additionalProperties: false
      description: One change to the registry, kept so stewards can see who changed what.
    RegistryMapParameterBody:
      type: object
      properties:
        domain:
          type:
            - string
            - "null"
      required:
        - domain
      additionalProperties: false
    RegistryUpdateDomainBody:
      type: object
      properties:
        label:
          type: string
        icon:
          type: string
        description:
          type: string
      required:
        - label
        - icon
        - description
      additionalProperties: false
    ReviewState:
      type: string
      enum:
        - released
        - in_review
        - not_released
      description: Where a classroom's released data stands.
    SiteContent:
      type: object
      properties:
        hero:
          type: object
          properties:
            eyebrow:
              type: string
            title:
              type: string
            body:
              type: string
          required:
            - eyebrow
            - title
            - body
          additionalProperties: false
        programme:
          type: string
          description: Footer line naming the programme.
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SiteSection"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/SiteSection"
          description: "Footer links: data terms, privacy and consent, safeguarding."
        stages:
          type: array
          items:
            $ref: "#/components/schemas/ClassroomStage"
        regions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
            required:
              - id
              - label
            additionalProperties: false
          description: The regions classrooms are grouped by in the directory (AP-28), in display order.
        languages:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              label:
                type: string
              ready:
                type: boolean
            required:
              - code
              - label
              - ready
            additionalProperties: false
        sampleData:
          type: boolean
          description: "True while the data shown is sample data: every page that shows it says so."
        hosting:
          type: object
          properties:
            title:
              type: string
            intro:
              type: string
            submitted:
              type: string
          required:
            - title
            - intro
            - submitted
          additionalProperties: false
          description: 'The "Host a Global Classroom" application (AP-30): its words.'
        joinClassroom:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
            action:
              type: string
          required:
            - title
            - body
            - action
          additionalProperties: false
          description: The "Join this classroom" box on a classroom profile (AP-29).
        consentSheet:
          $ref: "#/components/schemas/ConsentSheetContent"
          description: The printable guardian consent sheet (AP-38).
      required:
        - hero
        - programme
        - sections
        - policies
        - stages
        - regions
        - languages
        - sampleData
        - hosting
        - joinClassroom
        - consentSheet
      additionalProperties: false
      description: The public site's words and structure, edited as content rather than code.
    SiteProfile:
      type: object
      properties:
        setting:
          $ref: "#/components/schemas/SiteSetting"
        description:
          type: string
        researchQuestions:
          type: array
          items:
            type: string
        parameterNotes:
          type: object
          additionalProperties:
            type: string
          description: "\"What it means here\" (AP-23): the classroom's own two sentences on a value at this
            site, by registry ID. A value without one shows the registry's plain sentence."
      required:
        - setting
        - description
        - researchQuestions
      additionalProperties: false
      description: Onboarding questionnaire about the lab's site.
    SiteSection:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        href:
          type:
            - string
            - "null"
      required:
        - id
        - label
        - description
        - href
      additionalProperties: false
      description: A top-level section of the public site (AP-20). `href` is null until it is built.
    SiteSetting:
      type: string
      enum:
        - coastal
        - urban
        - rural
        - highland
        - forest
        - other
    StationCore:
      type: object
      properties:
        rain:
          type: object
          additionalProperties: false
          properties:
            bySource:
              type: array
              items:
                type: object
                properties:
                  sourceId:
                    type: string
                  name:
                    type:
                      - string
                      - "null"
                  value:
                    type: number
                  reference:
                    type: boolean
                required:
                  - sourceId
                  - name
                  - value
                  - reference
                additionalProperties: false
              description: Each source's total on the core day, the reference gauge first.
            tolerance:
              type: number
              description: How far apart sources may be, in mm, from the classroom's protocol.
            week:
              type: array
              items:
                $ref: "#/components/schemas/StationRainDay"
              description: The 7 days up to the core day, oldest first.
            review:
              $ref: "#/components/schemas/ReviewState"
            sources:
              type: number
              description: Sources with a value on the core day.
            spread:
              type:
                - number
                - "null"
              description: How far apart those sources are, in the reading's unit; null with fewer than two.
          required:
            - bySource
            - review
            - sources
            - spread
            - tolerance
            - week
        temperature:
          type: object
          additionalProperties: false
          properties:
            low:
              type:
                - number
                - "null"
            high:
              type:
                - number
                - "null"
            monthLow:
              type:
                - number
                - "null"
              description: The lowest and highest of the last 30 days.
            monthHigh:
              type:
                - number
                - "null"
            review:
              $ref: "#/components/schemas/ReviewState"
            sources:
              type: number
              description: Sources with a value on the core day.
            spread:
              type:
                - number
                - "null"
              description: How far apart those sources are, in the reading's unit; null with fewer than two.
          required:
            - high
            - low
            - monthHigh
            - monthLow
            - review
            - sources
            - spread
      required:
        - rain
        - temperature
      additionalProperties: false
      description: "The station page's detail on the core readings: review state, sources and today's range."
    StationRainDay:
      type: object
      properties:
        day:
          type: string
          description: "`YYYY-MM-DD`, UTC."
        value:
          type:
            - number
            - "null"
          description: The day's total; null when no source reported.
        reference:
          type: boolean
          description: The total is the manual gauge's, the reference; false when it is another source's.
        flagged:
          type: boolean
          description: The sources are further apart than the protocol allows, so the day goes to review.
      required:
        - day
        - value
        - reference
        - flagged
      additionalProperties: false
      description: One day of a classroom's rain (AP-23).
    SyncBatch:
      type: object
      properties:
        sentAt:
          type: string
          description: The device clock when the batch was sent, so the server can check it.
        records:
          type: array
          items:
            $ref: "#/components/schemas/SyncRecord"
      required:
        - sentAt
        - records
      additionalProperties: false
      description: Observations saved offline, sent together once the device is back online.
    SyncBatchResult:
      type: object
      properties:
        receivedAt:
          type: string
        clockOffsetMs:
          type: number
          description: Server clock minus the device clock when the batch arrived, in ms.
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncRecordResult"
          description: One per record, in the batch's order.
      required:
        - receivedAt
        - clockOffsetMs
        - results
      additionalProperties: false
    SyncOutcome:
      type: string
      enum:
        - stored
        - duplicate
        - rejected
      description: "`stored`: new. `duplicate`: already stored from an earlier attempt, returned as it
        was. `rejected`: not stored; `error` says why."
    SyncRecord:
      type: object
      properties:
        clientId:
          type: string
          description: Made on the device when the observation was saved; a retry sends the same one.
        observation:
          $ref: "#/components/schemas/ObservationInput"
        credit:
          type: boolean
      required:
        - clientId
        - observation
        - credit
      additionalProperties: false
      description: One observation saved on the device, sent in a sync batch.
    SyncRecordResult:
      type: object
      properties:
        clientId:
          type: string
        outcome:
          $ref: "#/components/schemas/SyncOutcome"
        observation:
          anyOf:
            - $ref: "#/components/schemas/Observation"
            - type: "null"
        error:
          type:
            - string
            - "null"
        fields:
          type: object
          additionalProperties:
            type: string
          description: Field-level messages when rejected, keyed by input name.
        clockFlags:
          type: array
          items:
            $ref: "#/components/schemas/ClockFlag"
      required:
        - clientId
        - outcome
        - observation
        - error
        - fields
        - clockFlags
      additionalProperties: false
    TemplateField:
      type: object
      properties:
        parameterId:
          type: string
        required:
          type: boolean
      required:
        - parameterId
        - required
      additionalProperties: false
      description: "One field of an observation template: a registry value, and whether it must be filled in."
    UpdateClassroomInput:
      type: object
      properties:
        name:
          type: string
        institutionName:
          type: string
      required:
        - name
        - institutionName
      additionalProperties: false
      description: Everything about a classroom except its code, which is its permanent identifier.
    User:
      type: object
      properties:
        id:
          type: string
        participantId:
          type: number
          description: "The participant ID (AP-39): unique, numeric, given when the account is created and
            never changed. It is all SAM, CSV exports and public pages ever carry about a person."
        publicProfile:
          type: boolean
          description: "The user's own consent to a public contributor profile (AP-39): their name, email and
            role next to their participant ID. Off by default; a minor can never turn it on."
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
        fullName:
          type: string
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        phoneVerified:
          type: boolean
        avatarUrl:
          type:
            - string
            - "null"
        role:
          $ref: "#/components/schemas/UserRole"
        platformAdmin:
          type: boolean
          description: Platform administrators can set up classrooms for institutions (admin-assisted setup).
        address:
          anyOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        onboardingCompleted:
          type: boolean
        minor:
          type: boolean
          description: "Under 18 (AP-04): contributes only while a guardian's consent is recorded."
        consent:
          $ref: "#/components/schemas/ConsentStatus"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - participantId
        - publicProfile
        - authProvider
        - fullName
        - email
        - phone
        - phoneVerified
        - avatarUrl
        - role
        - platformAdmin
        - address
        - onboardingCompleted
        - minor
        - consent
        - createdAt
        - updatedAt
      additionalProperties: false
    UserRole:
      type: string
      enum:
        - community_scientist
        - custodian
        - facilitator
        - institution_head
        - researcher
    ValueType:
      type: string
      enum:
        - number
        - text
        - time
      description: "`time` is a moment as Unix seconds: shown as a local date, never charted."
