          type: array
          items:
            $ref: "#/components/schemas/DeviceAlert"
          description: Active alerts from the latest reading. Empty for older readings.
      required:
        - device
        - classroomName
        - reading
        - alerts
      additionalProperties: false
      description: The latest reading of one device in a classroom the user belongs to.
    DataTerms:
      type: object
      properties:
        licence:
          type: string
          description: Licence name, e.g. "CC BY 4.0".
        licenceUrl:
          type:
            - string
            - "null"
        attribution:
          type: string
          description: How to credit the data in a paper, poster or report.
        restrictions:
          type: array
          items:
            type: string
          description: Limits on use or sharing; empty when there are none.
        coordinateDecimals:
          type:
            - number
            - "null"
          description: Positions are rounded to this many decimal places before they leave SAM; null for full.
      required:
        - licence
        - licenceUrl
        - attribution
        - restrictions
        - coordinateDecimals
      additionalProperties: false
      description: The terms attached to a classroom's data in SAM (AP-14). Every export of it carries
        them, so the data keeps its licence, credit and restrictions once it leaves the dashboard.
    Device:
      type: object
      properties:
        id:
          type: string
        labId:
          type: string
        labName:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/DeviceType"
        identifier:
          type: string
          description: Manufacturer serial or other hardware identifier.
        samSourceId:
          type:
            - string
            - "null"
          description: "SAM source identity: classroom code plus device identifier (SAM-06). Null when the
            viewer may not see the classroom code."
