components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: HTTP-only session cookie.
  responses:
    BadRequest:
      description: The input is invalid (`invalid_input`), or a code is wrong or old (`code_invalid`,
        `code_expired`). `fields` holds a message per input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Signed in, but not allowed (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource, or not visible to this user (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Clashes with existing data or a decision already made (`conflict`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests (`rate_limited`). Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - unauthenticated
            - invalid_input
            - not_found
            - rate_limited
            - code_invalid
            - code_expired
            - conflict
            - forbidden
        message:
          type: string
          description: Shown to the user as is.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Messages keyed by input name.
      required:
        - code
        - message
      additionalProperties: false
    Address:
      type: object
      properties:
        street:
          type: string
        suite:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        placeId:
          type: string
          description: Set when the address came from the places autocomplete.
        lat:
          type: number
        lng:
          type: number
      required:
        - street
        - city
        - state
        - zip
        - country
      additionalProperties: false
    AlertDirection:
      type: string
      enum:
        - above
        - below
    AlertLevel:
      type: string
      enum:
        - caution
        - warning
    AlertRule:
      type: object
      properties:
        id:
          type: string
        parameterId:
          type: string
        direction:
          $ref: "#/components/schemas/AlertDirection"
        value:
          type: number
        level:
          $ref: "#/components/schemas/AlertLevel"
        title:
          type: string
          description: Short name on the alert, e.g. `Very high UV`. States the reading; gives no advice.
        enabled:
          type: boolean
          description: Off keeps the rule without raising it.
      required:
        - id
        - parameterId
        - direction
        - value
        - level
        - title
        - enabled
      additionalProperties: false
      description: "One alert level on one parameter: a value above (or below) `value`, in the parameter's
        own unit, raises an alert. The same levels are the thresholds the dashboard shows."
    AlertRuleInput:
      type: object
      properties:
        parameterId:
          type: string
        direction:
          $ref: "#/components/schemas/AlertDirection"
        value:
          type: number
        level:
          $ref: "#/components/schemas/AlertLevel"
        title:
          type: string
          description: Short name on the alert, e.g. `Very high UV`. States the reading; gives no advice.
        enabled:
          type: boolean
          description: Off keeps the rule without raising it.
      required:
        - parameterId
        - direction
        - value
        - level
        - title
        - enabled
      additionalProperties: false
    AlertScope:
      type: string
      enum:
        - device
        - type
      description: "Where a rule applies: one device, or every device of a sensor type in a classroom. For
        each parameter, a device's own rules win over its type's, and those over the platform
        defaults."
    AltUnit:
      type: object
      properties:
        unit:
          type: string
        factor:
          type: number
        offset:
          type: number
      required:
        - unit
        - factor
      additionalProperties: false
      description: "Another unit for a value: `value * factor + offset` gives it in the parameter's own unit."
    AuthProvider:
      type: string
      enum:
        - google
        - phone
      description: "Domain model shared by the UI and every data source (mock today, SAM / auth API
        later). Keep these shapes backend-agnostic: no localStorage or fetch details belong here."
    AuthRequestPhoneCodeBody:
      type: object
      properties:
        phone:
          type: string
      required:
        - phone
      additionalProperties: false
    AuthResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        isNewUser:
          type: boolean
          description: True when this sign-in created the account.
      required:
        - user
        - isNewUser
      additionalProperties: false
    AuthSignInWithGoogleBody:
      type: object
      properties:
        idToken:
          type: string
      required:
        - idToken
      additionalProperties: false
    AuthVerifyPhoneCodeBody:
      type: object
      properties:
        requestId:
          type: string
        code:
          type: string
      required:
        - requestId
        - code
      additionalProperties: false
    Calculation:
      type: object
      properties:
        method:
          type: string
          enum:
            - measured
            - derived
            - manual
        formula:
          type: string
          description: The formula for a derived value, or how a measured one is taken.
        inputs:
          type: array
          items:
            type: string
          description: Registry IDs of the values the formula uses.
        version:
          type: string
          description: The SAM registry version that defines it, and when that version was published.
        publishedAt:
          type: string
      required:
        - method
        - formula
        - inputs
        - version
        - publishedAt
      additionalProperties: false
    CalculationDetails:
      type: object
      properties:
        method:
          type: string
          enum:
            - measured
            - derived
            - manual
        formula:
          type: string
          description: The formula for a derived value, or how a measured one is taken.
        inputs:
          type: array
          items:
            type: string
          description: Registry IDs of the values the formula uses.
        version:
          type: string
          description: The SAM registry version that defines it, and when that version was published.
        publishedAt:
          type: string
        parameter:
          type: object
          properties:
            id:
              type: string
              description: Stable registry ID, e.g. `air_temperature`.
            label:
              type: string
            unit:
              type: string
            source:
              type: string
              enum:
                - weather_station
                - manual
                - device
            plain:
              type: string
              description: What the value means, in one plain sentence for someone without a science background
                (AP-07). States what is measured; never advice, never a cause.
          required:
            - id
            - label
            - unit
            - source
          additionalProperties: false
        inputDetails:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Stable registry ID, e.g. `air_temperature`.
              label:
                type: string
              unit:
                type: string
            required:
              - id
              - label
              - unit
            additionalProperties: false
      required:
        - formula
        - inputDetails
        - inputs
        - method
        - parameter
        - publishedAt
        - version
      additionalProperties: false
      description: 'What "How is this calculated?" shows: the calculation with its inputs named.'
    Chart:
      type: string
      enum:
        - daily_bars
        - line_band
        - line
    ClassroomDetail:
      type: object
      properties:
        classroom:
          $ref: "#/components/schemas/ClassroomSummary"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClassroomMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
          description: Only for people who can manage the classroom; empty otherwise.
        permissions:
          type: object
          properties:
            invite:
              type: array
              items:
                $ref: "#/components/schemas/ClassroomRole"
            manageMembers:
              type: boolean
            edit:
              type: boolean
              description: Can change the name and institution. The code never changes.
            viewCode:
              type: boolean
              description: "Can see the classroom code: platform admins, the institution head and facilitators."
            manageConsent:
              type: boolean
              description: "Can see and record minors' guardian consent: the institution head and facilitators."
          required:
            - invite
            - manageMembers
            - edit
            - viewCode
            - manageConsent
          additionalProperties: false
      required:
        - classroom
        - members
        - invitations
        - permissions
      additionalProperties: false
    ClassroomMember:
      type: object
      properties:
        userId:
          type: string
        fullName:
          type: string
        email:
          type:
            - string
            - "null"
        role:
          $ref: "#/components/schemas/ClassroomRole"
        joinedAt:
          type: string
      required:
        - userId
        - fullName
        - email
        - role
        - joinedAt
      additionalProperties: false
    ClassroomRole:
      type: string
      enum:
        - institution_head
        - facilitator
        - community_scientist
        - researcher
    ClassroomSession:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        startsAt:
          type: string
        place:
          type: string
      required:
        - id
        - title
        - startsAt
        - place
      additionalProperties: false
      description: A session on the classroom's calendar (LP-06).
    ClassroomsInviteBody:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
        role:
          $ref: "#/components/schemas/ClassroomRole"
      required:
        - emails
        - role
      additionalProperties: false
    ClassroomsSetMemberRoleBody:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/ClassroomRole"
      required:
        - role
      additionalProperties: false
    ClassroomStage:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        color:
          type: string
          description: Marker and badge color, as a CSS color.
      required:
        - id
        - label
        - description
        - color
      additionalProperties: false
      description: A Global Classroom's stage on the way to operating, e.g. pilot.
    ClassroomSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        institutionName:
          type: string
        code:
          type:
            - string
            - "null"
          description: "Unique global classroom code, also the classroom's source identifier in SAM. Null when
            the viewer is contributor tier: the code is never sent to them."
        setup:
          type: string
          enum:
            - self_service
            - admin_assisted
        createdAt:
          type: string
        myRole:
          anyOf:
            - $ref: "#/components/schemas/ClassroomRole"
            - type: "null"
          description: The viewer's role; null for a platform admin who is not a member.
        canRecord:
          type: boolean
          description: "Whether the viewer records readings here: members other than researchers, who only
            read."
        memberCount:
          type: number
      required:
        - canRecord
        - code
        - createdAt
        - id
        - institutionName
        - memberCount
        - myRole
        - name
        - setup
      additionalProperties: false
    ClockFlag:
      type: string
      enum:
        - device_clock_off
        - observed_after_sent
      description: "Something wrong with the device's clock, found when a batch is synced: the clock was
        more than a few minutes off the server's, or the observation is dated after the device sent
        it."
    ConsentDecideBody:
      type: object
      properties:
        give:
          type: boolean
      required:
        - give
      additionalProperties: false
    ConsentMethod:
      type: string
      enum:
        - link
        - paper
