        classroomName:
          type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveAlertRule"
        canEditDevice:
          type: boolean
          description: Heads and facilitators set one device's levels.
        canEditType:
          type: boolean
          description: Only the institution head sets the classroom's levels for a sensor type.
      required:
        - deviceId
        - deviceName
        - deviceType
        - classroomName
        - rules
        - canEditDevice
        - canEditType
      additionalProperties: false
    DeviceSummaryCard:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        unit:
          type: string
        icon:
          type:
            - string
            - "null"
          description: The value's domain icon from the registry, when it has a domain.
