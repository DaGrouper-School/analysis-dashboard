            - caution
            - warning
        title:
          type: string
        message:
          type: string
      required:
        - parameterId
        - level
        - title
        - message
      additionalProperties: false
      description: A condition in a device's latest reading that crosses a threshold.
    DeviceAlerts:
      type: object
      properties:
