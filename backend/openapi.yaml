          type:
            - number
            - "null"
        observedAt:
          type:
            - string
            - "null"
        week:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
              value:
                type:
                  - number
                  - "null"
            required:
              - day
              - value
            additionalProperties: false
          description: Seven days up to the newest reading, oldest first.
        todayLow:
          type:
            - number
            - "null"
        todayHigh:
          type:
            - number
            - "null"
        weekLow:
          type:
            - number
            - "null"
        weekHigh:
          type:
            - number
            - "null"
      required:
        - id
        - label
        - unit
        - icon
        - latest
        - observedAt
        - week
        - todayLow
        - todayHigh
        - weekLow
        - weekHigh
      additionalProperties: false
      description: "One card value of a device over its last 7 days (AP-45): the newest value, the last
        value of each day, and today's and the week's range. Days without a reading stay empty."
    DeviceType:
      type: string
      description: "A device type's ID. Built in: weather_station, soil_sensor, rain_gauge, water_probe,
        air_quality_sensor, other. Platform admins register more."
    DeviceTypeDefinition:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/DeviceType"
          description: Stable ID, e.g. `soil_sensor`.
        label:
          type: string
        description:
          type: string
        color:
          type: string
          description: Marker and chip color.
        icon:
          type: string
          description: A registry icon name (see `#lib/icons.ts`), picked by a platform admin.
        parameterIds:
          type: array
          items:
            type: string
          description: Registry parameters the device sends, in display order.
        tileParameterIds:
          type: array
          items:
            type: string
          description: The values shown as tiles in "What's happening now?" when this device is picked
            (AP-45), in order. Set in the Registry; a subset of `parameterIds`. None shows whatever
            the device sends.
        cardParameterIds:
          type: array
          items:
            type: string
          description: The numbers charted as cards under "What's happening now?" when this device is picked
            (AP-45), in order. Set in the Registry; a subset of `parameterIds`. None shows no cards.
