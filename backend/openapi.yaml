          type: boolean
          description: 'Entered by hand, with no sensor: added to a lab without pairing, with a generated
            identifier, and recorded with "Enter measurement" instead of a sync.'
      required:
        - id
        - label
        - description
        - color
        - icon
        - parameterIds
        - tileParameterIds
        - cardParameterIds
      additionalProperties: false
      description: A kind of device and the values it is expected to send (SAM-23). Shared by every classroom.
    DeviceTypeInput:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        color:
          type: string
        icon:
          type: string
          description: A registry icon name. Blank keeps the current icon, or the generic sensor for a new type.
        manual:
          type: boolean
          description: Entered by hand, with no sensor attached.
        values:
          type: array
          items:
            $ref: "#/components/schemas/ExpectedValueInput"
      required:
        - label
        - description
        - color
        - values
      additionalProperties: false
    DomainCompleteness:
      type: object
      properties:
        domain:
          anyOf:
            - type: object
              properties:
                id:
                  $ref: "#/components/schemas/EnvironmentalDomain"
                  description: Short code, upper case, e.g. `SOIL`. Never changes once created.
                label:
                  type: string
                icon:
                  type: string
                  description: A registry icon name (see `#lib/icons.ts`), shown on tabs and cards.
              required:
                - id
                - label
                - icon
              additionalProperties: false
            - type: "null"
        received:
          type: number
          description: Expected slots (hours, days or weeks) that have a reading.
        expected:
          type: number
        days:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
              status:
                type: string
                enum:
                  - complete
                  - partial
                  - missing
            required:
              - day
              - status
            additionalProperties: false
          description: Each day of the month so far, for values read daily or faster. Gaps stay gaps.
      required:
        - domain
        - received
        - expected
        - days
      additionalProperties: false
      description: How much of the month one domain's protocol has received (AP-22).
    DomainDefinition:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/EnvironmentalDomain"
          description: Short code, upper case, e.g. `SOIL`. Never changes once created.
        label:
          type: string
        icon:
          type: string
          description: A registry icon name (see `#lib/icons.ts`), shown on tabs and cards.
        description:
          type: string
      required:
        - id
        - label
        - icon
        - description
      additionalProperties: false
      description: An environmental domain in the registry (SAM-23). Shared by every classroom.
    DomainInput:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        icon:
          type: string
        description:
          type: string
      required:
        - id
        - label
        - icon
        - description
      additionalProperties: false
    EffectiveAlertRule:
      type: object
      properties:
        id:
          type: string
        parameterId:
          type: string
        direction:
          $ref: "#/components/schemas/AlertDirection"
        value:
          type: number
        level:
