# Generated by `npm run openapi` in frontend/. Do not edit by hand.
openapi: 3.1.0
info:
  title: DaGrouper School backend API
  version: 0.0.1
  description: >-
    The API the front end calls. The front end never calls SAM; this backend does, and keeps SAM
    behind it.


    **Status:** proposal to agree on (BE-01). The front end runs on a mock with the same interfaces;
    set `VITE_DATA_SOURCE=http` and `VITE_API_URL` to call this API instead.


    **Sessions:** an HTTP-only cookie set by the sign-in routes. The front end sends `credentials:
    include` and never handles tokens.


    **Errors:** every failure returns `Error`: a `code`, a `message` the UI can show, and `fields`
    with a message per input.


    **Generated** from `frontend/src/lib/services` by `npm run openapi`. Do not edit by hand.
servers:
  - url: /api
    description: Same origin as the front end
security:
  - session: []
tags:
  - name: Auth
    description: Sign-in with Google or a phone code, and the session cookie.
  - name: Profile
    description: The signed-in user's own profile, phone, address, onboarding and guardian consent.
  - name: Classrooms
    description: |-
      Classrooms (AP-03). Permission checks and code redaction happen behind this interface,
      never only in the UI.
  - name: Labs and devices
    description: Labs and their devices (AP-05). Each device is registered in SAM as a source.
  - name: Exports
    description: |-
      SAM's export service (AP-14): raw values of one classroom, filtered and sorted on the server,
      and the same as a CSV file. Only classrooms the user belongs to; platform admins included.
  - name: Public site
    description: "The public site (AP-20): open to visitors, no sign-in. Released data only."
  - name: Guardian consent
    description: |-
      The guardian's side of consent (AP-04), reached from the link they were sent. No sign-in. Each
      change is sent to SAM as a `consent` attribute assertion, and SAM enforces it.
  - name: Hosting
    description: Applying to host a Global Classroom (AP-30). Applying needs no sign-in.
  - name: Places
    description: Address lookup, proxied so the provider key stays on the server.
  - name: Registry
    description: |-
      The shared registry (SAM-05, SAM-23): parameters, environmental domains and device types.
      Everyone signed in can read it; only platform admins change it, and every change is logged.
paths:
  /auth/me:
    get:
      tags:
        - Auth
      operationId: auth.getCurrentUser
      summary: Get current user
      description: |-
        The signed-in user, or null. Real backend: reads the HTTP-only session cookie.

        Returns 401 when there is no session. The front end treats that as signed out.

        Access: public, no session needed.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/google:
    post:
      tags:
        - Auth
      operationId: auth.signInWithGoogle
      summary: Sign in with google
      description: |-
        Exchange a Google ID token for a session. The backend verifies the token.

        Sets the HTTP-only session cookie.

        Access: public, no session needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignInWithGoogleBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/phone/start:
    post:
      tags:
        - Auth
      operationId: auth.requestPhoneCode
      summary: Request phone code
      description: |-
        Validate the number and send a 6-digit SMS code.

        Access: public, no session needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequestPhoneCodeBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/phone/verify:
    post:
      tags:
        - Auth
      operationId: auth.verifyPhoneCode
      summary: Verify phone code
      description: >-
        Verify the SMS code and start a session.


        Sets the HTTP-only session cookie. Wrong or old codes return `code_invalid` or
        `code_expired`.


        Access: public, no session needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyPhoneCodeBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/sign-out:
    post:
      tags:
        - Auth
      operationId: auth.signOut
      summary: Sign out
      description: |-
        Clears the session cookie.

        Access: signed-in users. Classroom roles are checked on the server.
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/profile:
    patch:
      tags:
        - Profile
      operationId: profile.updateProfile
      summary: Update profile
      description: "Access: signed-in users. Classroom roles are checked on the server."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/phone/start:
    post:
      tags:
        - Profile
      operationId: profile.startPhoneVerification
      summary: Start phone verification
      description: |-
        Google sign-ups verify a phone number during onboarding.

        Access: signed-in users. Classroom roles are checked on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileStartPhoneVerificationBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/phone/verify:
    post:
      tags:
        - Profile
      operationId: profile.confirmPhoneVerification
      summary: Confirm phone verification
      description: "Access: signed-in users. Classroom roles are checked on the server."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileConfirmPhoneVerificationBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/address:
    put:
      tags:
        - Profile
      operationId: profile.updateAddress
      summary: Update address
      description: "Access: signed-in users. Classroom roles are checked on the server."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/onboarding/complete:
    post:
      tags:
        - Profile
      operationId: profile.completeOnboarding
      summary: Complete onboarding
      description: |-
        Checks required fields and sets `onboardingCompleted`.

        Access: signed-in users. Classroom roles are checked on the server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/public-profile:
    put:
      tags:
        - Profile
      operationId: profile.setPublicProfile
      summary: Set public profile
      description: |-
        Turns the public contributor profile on or off (AP-39): name, email and role next to the
        participant ID. Refused for a minor.

        Returns 403 when a minor tries to turn it on.

        Access: signed-in users. Classroom roles are checked on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSetPublicProfileBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/guardian-consent:
    post:
      tags:
        - Profile
      operationId: profile.requestGuardianConsent
      summary: Request guardian consent
      description: |-
        Marks the user as under 18 and sends their guardian a consent link (AP-04). Asking again
        sends a new link; the old one stops working and consent is pending until answered.

        The backend emails the guardian their link. The link is never returned to the minor.

        Access: signed-in users. Classroom roles are checked on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianConsent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags:
        - Profile
      operationId: profile.getGuardianConsent
      summary: Get guardian consent
      description: |-
        The signed-in user's consent request, or null when they never needed one.

        Access: signed-in users. Classroom roles are checked on the server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GuardianConsent"
                  - type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me/minor:
    post:
      tags:
        - Profile
      operationId: profile.markMinor
      summary: Mark minor
      description: |-
        Marks the user as under 18 without sending a link (AP-38): their classroom records a signed
        paper sheet instead. Consent is pending until then.

        Access: signed-in users. Classroom roles are checked on the server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /classrooms:
    get:
      tags:
        - Classrooms
      operationId: classrooms.listMine
      summary: List mine
      description: "Access: signed-in users. Classroom roles are checked on the server."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassroomSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Classrooms
      operationId: classrooms.create
      summary: Create
      description: |-
        Institution heads create their own; platform admins can set one up for a head.

        Access: signed-in users. Classroom roles are checked on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /classrooms/{classroomId}:
    get:
      tags:
        - Classrooms
      operationId: classrooms.get
      summary: Get
      description: "Access: signed-in users. Classroom roles are checked on the server."
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Classrooms
      operationId: classrooms.update
      summary: Update
      description: |-
        Name and institution. The classroom code is its identifier and cannot change.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassroomInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /classrooms/{classroomId}/invitations:
    post:
      tags:
        - Classrooms
      operationId: classrooms.invite
      summary: Invite
      description: |-
        Sends one invitation email per address.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomsInviteBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /invitations/{invitationId}:
    delete:
      tags:
        - Classrooms
      operationId: classrooms.revokeInvitation
      summary: Revoke invitation
      description: "Access: signed-in users. Classroom roles are checked on the server."
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /classrooms/{classroomId}/members/{userId}:
    patch:
      tags:
        - Classrooms
      operationId: classrooms.setMemberRole
      summary: Set member role
      description: "Access: signed-in users. Classroom roles are checked on the server."
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomsSetMemberRoleBody"
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Classrooms
      operationId: classrooms.removeMember
      summary: Remove member
      description: "Access: signed-in users. Classroom roles are checked on the server."
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /classrooms/{classroomId}/consent:
    get:
      tags:
        - Classrooms
      operationId: classrooms.listConsent
      summary: List consent
      description: |-
        Guardian consent of the classroom's minors (AP-38). Only its head and facilitators; anyone
        else is refused.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberConsent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /classrooms/{classroomId}/consent/{userId}:
    put:
      tags:
        - Classrooms
      operationId: classrooms.recordPaperConsent
      summary: Record paper consent
      description: |-
        Records a signed paper sheet: consent given or withdrawn, the day on it, and who recorded
        it. Like the guardian's link, the decision is asserted to SAM as `consent`.

        The recorder is the signed-in user. The decision is asserted to SAM as `consent`.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperConsentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberConsent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /classrooms/{classroomId}/consent-sheet:
    get:
      tags:
        - Classrooms
      operationId: classrooms.consentSheet
      summary: Consent sheet
      description: |-
        The printable sheet with the classroom's details filled in. Head and facilitators only.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentSheet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /invitations/by-token/{token}:
    get:
      tags:
        - Classrooms
      operationId: classrooms.getInvitation
      summary: Get invitation
      description: |-
        Public: what an invite link points to.

        Access: public, no session needed.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          $ref: "#/components/responses/NotFound"
  /me/invitations:
    get:
      tags:
        - Classrooms
      operationId: classrooms.listMyInvitations
      summary: List my invitations
      description: |-
        Pending invitations sent to the signed-in user's email, newest first.

        Access: signed-in users. Classroom roles are checked on the server.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationPreview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /invitations/by-token/{token}/accept:
    post:
      tags:
        - Classrooms
      operationId: classrooms.acceptInvitation
      summary: Accept invitation
      description: |-
        Joins the signed-in user to the classroom. Their email must match the invitation.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /classrooms/{classroomId}/labs:
    get:
      tags:
        - Labs and devices
      operationId: labs.listForClassroom
      summary: List for classroom
      description: "Access: signed-in users. Classroom roles are checked on the server."
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lab"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Labs and devices
      operationId: labs.create
      summary: Create
      description: |-
        Classroom onboarding step: the lab and its site profile questionnaire.

        Access: signed-in users. Classroom roles are checked on the server.
      parameters:
        - name: classroomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lab"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /labs/{labId}:
    get:
      tags:
        - Labs and devices
      operationId: labs.get
      summary: Get
      description: "Access: signed-in users. Classroom roles are checked on the server."
      parameters:
        - name: labId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
