    EnvironmentalDomain:
      type: string
      description: An environmental domain's short code, e.g. `AIR` or `SOIL`. Platform admins add domains.
    ExpectedValueInput:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        unit:
          type: string
        valueType:
          $ref: "#/components/schemas/ValueType"
        domain:
          anyOf:
            - $ref: "#/components/schemas/EnvironmentalDomain"
            - type: "null"
          description: Used when the value is new to the registry; existing values keep their mapping.
        tile:
          type: boolean
          description: A tile in "What's happening now?" when a device of this type is picked, in row order.
