        guardianName:
          type: string
        classroomNames:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ConsentStatus"
        decidedAt:
          type:
            - string
            - "null"
        coordinateDecimals:
          type: number
          description: Positions from the contributor's phone are rounded to this many decimal places.
      required:
        - contributorName
        - guardianName
        - classroomNames
        - status
        - decidedAt
        - coordinateDecimals
      additionalProperties: false
      description: What the guardian sees when they open their link. No sign-in.
    ConsentSheet:
      type: object
      properties:
        classroomName:
          type: string
        institutionName:
          type: string
        content:
          $ref: "#/components/schemas/ConsentSheetContent"
