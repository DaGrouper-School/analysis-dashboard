name: Backend

on:
  push:
    branches: [main]
    paths: &paths
      - 'backend/**'
      # The contract (backend/openapi.yaml) is generated from the front end's
      # routes, service interfaces and domain types.
      - 'frontend/scripts/openapi.ts'
      - 'frontend/src/lib/services/**'
      - 'frontend/src/lib/domain/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: dgs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      DGS_TEST_DATABASE_URL: postgres://postgres:dgs@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Contract is current
        working-directory: .
        run: |
          npm ci
          npm run openapi:check -w frontend
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      # The same targets as on a laptop, so the two never drift.
      - name: Modules tidy
        run: make tidy-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Vulnerabilities
        run: make vulncheck
      - name: Build image
        run: docker build -t dgs:ci .
